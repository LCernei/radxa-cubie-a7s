---
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"

- name: Make the hostname resolve locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ base_hostname }}"

- name: Set the timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Hold kernel, bootloader and WiFi driver packages
  block:
    - name: List installed packages
      ansible.builtin.package_facts:

    - name: Hold board packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ base_board_packages }}"
      when: item in ansible_facts.packages

- name: Refresh package lists
  # No cache_valid_time: a fresh image has empty lists with a recent timestamp.
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

# man-db rebuilds its index after every package install: slow on the board and in tests/vm/.
# The trigger runs only if this file exists; postinst recreates it from the debconf answer.
- name: Don't rebuild the man page index on package installs
  ansible.builtin.debconf:
    name: man-db
    question: man-db/auto-update
    vtype: boolean
    value: "false"

- name: Remove the man-db trigger flag
  ansible.builtin.file:
    path: /var/lib/man-db/auto-update
    state: absent

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    install_recommends: false # they pull in exim4 and cron

- name: Enable automatic Debian security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Passwords are switched off below: without a listed user, a fresh image has no key that logs in.
- name: Check the list of GitHub users
  ansible.builtin.assert:
    that:
      - base_github_users | length > 0
      - base_github_users | select('match', '^[A-Za-z0-9-]+$') | list == base_github_users
    fail_msg: "Set base_github_users in ansible/host_vars/cubie.yml (copy cubie.yml.example)"
    quiet: true

# Adds each user's GitHub keys if missing; keys already on the board stay (docs/decisions/0010).
- name: Authorize the GitHub keys of the listed users
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "https://github.com/{{ item }}.keys"
  loop: "{{ base_github_users }}"

- name: Allow only key logins over SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-keys-only.conf
    mode: "0644"
    content: |
      # Managed by Ansible
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  notify: Reload SSH

- name: Check the SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false

- name: Remove the image's second sudo user
  ansible.builtin.user:
    name: rock
    state: absent

# Read-only access to the CUPS logs (/var/log/cups, root:adm) and the system journal, without sudo.
- name: Let the admin user read the logs
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: [adm]
    append: true

- name: Keep the la alias from the old card
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    regexp: "^#?alias la="
    line: "alias la='ls -lA'"

- name: Boot without a graphical target
  ansible.builtin.file:
    src: /usr/lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

# Not service_facts: it queries every unit one at a time.
- name: Find which unneeded services exist
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'list-unit-files', '--no-legend', '--no-pager'] + base_unneeded_services }}"
  register: base_units
  changed_when: false
  failed_when: base_units.rc not in [0, 1]
  check_mode: false

- name: Disable services this server does not use
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ base_unneeded_services }}"
  when: item in base_units.stdout
